services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "FTC Simulator"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    environment:
      # Passed through from the sandbox environment so Vite accepts the preview
      # host; left unset outside it (Vite then uses its default host checks).
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts often swallow filesystem events; poll so HMR still fires.
      - CHOKIDAR_USEPOLLING=true
    # Deps live in a named volume, so install from the lockfile on every start
    # (cheap after the first run thanks to the npm cache) before the dev server.
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: on-failure

volumes:
  node_modules:
  npm_cache:
